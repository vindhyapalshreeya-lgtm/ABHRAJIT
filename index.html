#rp::after{background:linear-gradient(90deg,rgba(50,28,8,.32),transparent 12%)}
#cover{position:absolute;left:var(--pw);top:0;width:var(--pw);height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.5,0,.2,1);cursor:pointer;z-index:30;border-radius:0 6px 6px 0}
#book.open #cover{transform:rotateY(-180deg);pointer-events:none;opacity:0;transition:transform 1s cubic-bezier(.5,0,.2,1),opacity .2s 1s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:0 6px 6px 0;box-shadow:0 16px 34px rgba(0,0,0,.4)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.back{transform:rotateY(180deg);background:var(--tex),var(--kraft);box-shadow:none}
#cover:focus-visible,.letter:focus-visible,button:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
/* envelope (percent of page) */
.eback,.flap,.efront{position:absolute;left:8%;width:84%}
.eback{top:48%;height:31.5%;background:var(--tex),#b48c5c;z-index:0;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.flap{top:31%;height:17.2%;background:var(--tex),#9c774b;clip-path:polygon(0 100%,50% 0,100% 100%);z-index:1}
.efront{top:48%;height:31.5%;z-index:3;filter:drop-shadow(0 -1px 1px rgba(40,20,0,.45));pointer-events:none}
.efront i{position:absolute;inset:0;background:var(--tex),#c9a46f;clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:7%;font:700 clamp(14px,calc(var(--pw)*.085),30px) Caveat,cursive;color:#6b4526;font-style:normal}
.letter{position:absolute;left:17%;top:30%;width:66%;z-index:2;cursor:pointer;filter:drop-shadow(0 3px 5px rgba(40,20,0,.35));transform:rotate(-1.5deg);transition:left .7s cubic-bezier(.4,0,.2,1),top .7s cubic-bezier(.4,0,.2,1),width .7s cubic-bezier(.4,0,.2,1),transform .7s}
.letter img{display:block;width:100%;clip-path:inset(0 0 27% 0);transition:clip-path .7s cubic-bezier(.4,0,.2,1)}
.letter.up{left:12%;top:6%;width:76%;z-index:6;transform:none;filter:drop-shadow(0 10px 18px rgba(40,20,0,.5))}
.letter.up img{clip-path:inset(0 0 0 0)}
.tip{position:absolute;left:0;right:0;bottom:7%;text-align:center;font:700 clamp(15px,calc(var(--pw)*.09),30px) Caveat,cursive;color:#5b3c1f;z-index:4;pointer-events:none}
/* candles */
.c{position:absolute;width:6.5%;transform:translateX(-50%);z-index:5}
.c img.candle{display:block;width:100%}
.flame{position:absolute;width:150%;left:-25%;bottom:calc(100% - 4%);transform-origin:50% 94%;transition:opacity .35s;pointer-events:none;will-change:transform}
.flame.out{opacity:0}
#wish{position:absolute;left:50%;top:37%;transform:translateX(-50%) rotate(-1.5deg);width:78%;z-index:25;text-align:center;background:var(--chip);padding:3.5% 4% 4%;box-shadow:0 5px 12px rgba(0,0,0,.35);clip-path:polygon(0 3%,8% 0,30% 2%,55% 0,80% 2%,100% 0,99% 40%,100% 100%,70% 98%,40% 100%,10% 98%,0 100%,1% 50%);opacity:0;pointer-events:none;transition:opacity .5s}
#wish.show{opacity:1;pointer-events:auto}
#wish p{margin:0 0 .3em;font:700 clamp(18px,calc(var(--pw)*.13),40px) Caveat,cursive;color:var(--rose);line-height:1.05}
/* bar */
#hint,#bar{width:calc(var(--pw)*2);margin-top:2.4dvh;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:center;font-size:clamp(11px,1.5dvh,14px)}
#hint{font:700 clamp(18px,3dvh,26px) Caveat,cursive;color:#fff6e2;text-shadow:0 1px 2px rgba(0,0,0,.5);justify-content:center}
#bar{display:none}
body.is-open #bar{display:flex}
body.is-open #hint{display:none}
button{font:inherit;color:var(--ink);background:var(--chip);border:0;padding:.55em 1em;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.35);clip-path:polygon(0 4%,10% 0,50% 3%,90% 0,100% 5%,99% 95%,60% 100%,30% 97%,0 100%);touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active,button.on{background:#e3c78f}
#relight{position:static}
.meter{width:min(28vw,150px);height:12px;background:rgba(40,20,0,.35);border-radius:7px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e9b44c,#c0344f)}
#note{flex-basis:100%;text-align:center;color:#fff6e2;text-shadow:0 1px 2px rgba(0,0,0,.55);line-height:1.35}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>

 <div id="hint">tap the cover to open</div>
 <div id="bar">
  <button id="back" type="button">Back to cover</button>
  <button id="mic" type="button">Use mic</button>
  <div class="meter" title="Mic level"><i id="lvl"></i></div>
  <button id="hold" type="button">Hold to blow</button>
  <div id="note">Blow into your mic, or hold the button or space bar.</div>
 </div>
</main>
<canvas id="cf"></canvas>
<script>
(function(){
var $=function(s){return document.querySelector(s)},book=$('#book'),cover=$('#cover'),letter=$('#letter'),tip=$('#tip'),
 flames=[].slice.call(document.querySelectorAll('.flame')),lvl=$('#lvl'),wish=$('#wish'),note=$('#note'),micBtn=$('#mic'),holdBtn=$('#hold');
var isOpen=false,lit=true,held=false,level=0,blowT=0,mic=null,floor=0,NAME='Abhra';
function setOpen(v){isOpen=v;book.classList.toggle('open',v);document.body.classList.toggle('is-open',v);cover.setAttribute('aria-label',v?'Card is open':'Open the card');if(!v)tuck()}
function tuck(){letter.classList.remove('up');letter.setAttribute('aria-pressed','false');tip.textContent='tap the letter';tip.style.opacity=1}
function toggleLetter(){var up=letter.classList.toggle('up');letter.setAttribute('aria-pressed',up);tip.style.opacity=up?0:1}
cover.addEventListener('click',function(){setOpen(true)});
cover.addEventListener('keydown',function(e){if(!isOpen&&(e.key==='Enter'||e.code==='Space')){e.preventDefault();setOpen(true)}});
$('#back').addEventListener('click',function(){setOpen(false);relight()});
letter.addEventListener('click',toggleLetter);
letter.addEventListener('keydown',function(e){if(e.key==='Enter'||e.code==='Space'){e.preventDefault();e.stopPropagation();toggleLetter()}});
function say(t){note.textContent=t}
function startMic(){
 if(mic)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say(window.isSecureContext?'This browser cannot use the mic. Hold the button or space bar to blow.':'The mic only works over https. Host this file online (not opened from your device), or hold the button or space bar.');return}
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
  var AC=window.AudioContext||window.webkitAudioContext,ctx=new AC(),an=ctx.createAnalyser();an.fftSize=1024;
  ctx.createMediaStreamSource(s).connect(an);ctx.resume();mic={an:an,buf:new Float32Array(an.fftSize)};
  micBtn.textContent='Mic on';micBtn.classList.add('on');say('Mic is listening. Blow at it for half a second.');
 }).catch(function(){say('Mic is blocked or unavailable. Hold the button or space bar to blow.')});
}
micBtn.addEventListener('click',startMic);
function micLevel(){
 mic.an.getFloatTimeDomainData(mic.buf);var s=0,b=mic.buf,i;for(i=0;i<b.length;i++)s+=b[i]*b[i];var r=Math.sqrt(s/b.length);
 if(!floor||r<floor*1.5)floor+=(r-(floor||r))*.02;
 return Math.min(1,Math.max(0,r-floor*1.3)/.16);
}
function hold(v){held=v;holdBtn.classList.toggle('on',v)}
['pointerdown'].forEach(function(n){holdBtn.addEventListener(n,function(e){e.preventDefault();hold(true)})});
['pointerup','pointerleave','pointercancel'].forEach(function(n){holdBtn.addEventListener(n,function(){hold(false)})});
document.addEventListener('keydown',function(e){if(e.code==='Space'&&isOpen){e.preventDefault();if(!e.repeat)hold(true)}});
document.addEventListener('keyup',function(e){if(e.code==='Space'&&isOpen){e.preventDefault();hold(false)}});
function snuff(){
 lit=false;
 flames.forEach(function(f,i){setTimeout(function(){f.style.transform='rotate(62deg) translateY(-8%) scale(.5,.35)';f.classList.add('out')},i*70)});
 setTimeout(function(){wish.classList.add('show');confetti()},450);
}
function relight(){
 if(lit&&!wish.classList.contains('show'))return;
 lit=true;blowT=0;wish.classList.remove('show');flames.forEach(function(f){f.classList.remove('out')});
}
$('#relight').addEventListener('click',relight);
var last=performance.now();
function tick(now){
 var dt=Math.min(.1,(now-last)/1000);last=now;
 var raw=held?.9:(mic?micLevel():0);level+=(raw-level)*.4;lvl.style.width=(level*100)+'%';
 if(lit&&isOpen){
  if(level>.35)blowT+=dt;else blowT=Math.max(0,blowT-dt*2);
  var lean=Math.min(1,level/.8);
  flames.forEach(function(f,i){var fl=Math.sin(now/90+i*2)*2.2+Math.sin(now/37+i)*1.2;
   f.style.transform='rotate('+(fl+lean*48)+'deg) scale('+(1+Math.sin(now/110+i)*.04)+','+(1-lean*.3)+')'});
  if(blowT>=.5)snuff();
 }
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
var cv=$('#cf'),cx=cv.getContext('2d'),parts=[],running=false;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener('resize',size);size();
function confetti(){
 var cols=['#c0344f','#e9b44c','#7a8f4d','#f3e3c3','#a67c52','#d98a9a'],n=matchMedia('(prefers-reduced-motion:reduce)').matches?30:140,r=$('#rp').getBoundingClientRect();
 for(var i=0;i<n;i++)parts.push({x:r.left+r.width*(.2+Math.random()*.6),y:r.top+r.height*.3,vx:(Math.random()-.5)*9,vy:-Math.random()*11-3,w:6+Math.random()*7,h:4+Math.random()*5,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1});
 if(!running){running=true;requestAnimationFrame(draw)}
}
function draw(){
 cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
 parts=parts.filter(function(p){return p.life>0&&p.y<innerHeight+30});
 parts.forEach(function(p){p.vy+=.32;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life-=.0035;cx.save();cx.globalAlpha=Math.min(1,p.life*2);cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
 if(parts.length)requestAnimationFrame(draw);else{running=false;cx.clearRect(0,0,innerWidth,innerHeight)}
}
window.__card={setOpen:setOpen,hold:hold,get lit(){return lit}};
})();
</script>
